# Production stack: app + Postgres + Redis together on one host (see
# DEPLOY.md). This is a separate file from docker-compose.yml on
# purpose — local dev runs `manage.py runserver` directly against
# db/redis, not a containerized app, and this file doesn't touch that
# workflow at all.
services:
  db:
    image: postgres:16
    container_name: events_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - events_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host: only "web", over the internal compose
    # network, needs to reach this.

  redis:
    image: redis:7
    container_name: events_platform_redis
    restart: unless-stopped
    volumes:
      - events_platform_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: events_platform_web
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Not published to the host directly -- only "caddy" reaches this,
    # over the internal compose network, on the plain-HTTP port gunicorn
    # listens on. This is what makes Caddy a real TLS-terminating proxy
    # rather than a second, redundant way in.
    expose:
      - "8000"

  # Reverse proxy + automatic free TLS via Let's Encrypt. Caddy requests
  # and renews the certificate itself (no certbot cron job to maintain)
  # as long as CADDY_DOMAIN in .env is a real domain pointing at this
  # host's public IP and ports 80/443 are reachable from the internet --
  # both are required for Let's Encrypt's HTTP-01 challenge to succeed.
  caddy:
    image: caddy:2-alpine
    container_name: events_platform_caddy
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - events_platform_caddy_data:/data
      - events_platform_caddy_config:/config

volumes:
  events_platform_pgdata:
  events_platform_redisdata:
  events_platform_caddy_data:
  events_platform_caddy_config:
